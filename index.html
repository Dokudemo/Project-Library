<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Library</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./javascript.js" defer></script>
</head>
<body>
    <header>
        <h1>Manga Library</h1>
        <nav>
            <div class="catalog">
                <img src="./icons/catalog.svg" alt="catalog-icon" height="20px">
                <p>Catalog</p>
            </div>
            <div class="search">
                <img src="./icons/search.svg" alt="search-icon" height="20px">
                <p>Search</p>
            </div>
            <div class="forum">
                <img src="./icons/forum.svg" alt="focum-icon" height="20px">
                <p>Forum</p>
            </div>
        </nav>
        <user>
            <img src="./icons/avatar-girl.svg" height="50px">
            <usernick>Sakura</usernick>
            <h4>Log out</h4>
        </user>
    </header>
    <main>
        <h5>My Library</h5>
        <div class="library">
            <div class="carousel"></div>
        </div>
    </main>
</body>
</html>
